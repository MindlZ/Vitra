<!doctype html>
<!--
  The installer's welcome/finish sidebar (164 x 314, NSIS's size at 100%):
  the splash's last frame, the V lit in front of the risen sun on the
  waterline. Rendered to build/installerSidebar.bmp by render.ps1.
  Flat #120b17 at every edge, so it meets the page's MUI_BGCOLOR seamlessly.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 164px;
        height: 314px;
        position: relative;
        overflow: hidden;
        background: #120b17;
      }
      .glow {
        position: absolute;
        left: 50%;
        top: 60%;
        width: 210px;
        height: 170px;
        translate: -50% -50%;
        background: radial-gradient(50% 50% at 50% 50%, rgb(255 110 203 / 0.34), rgb(255 110 203 / 0) 70%);
      }
      .sky {
        position: absolute;
        left: 50%;
        bottom: 40%;
        width: 164px;
        height: 190px;
        translate: -50% 0;
        overflow: hidden;
        -webkit-box-reflect: below 1px linear-gradient(transparent 30%, rgba(0, 0, 0, 0.5));
      }
      .sun {
        position: absolute;
        left: 50%;
        bottom: 14px;
        width: 96px;
        height: 96px;
        margin-left: -48px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 30%,
          #fffafd 0%,
          color-mix(in srgb, rgb(255 190 232) 60%, white) 38%,
          color-mix(in srgb, #ff6ecb 60%, white) 72%,
          #ff6ecb 100%
        );
        box-shadow:
          0 0 30px 4px rgb(255 110 203 / 0.55),
          0 0 70px 18px rgb(255 110 203 / 0.2);
      }
      .mark {
        position: absolute;
        left: 50%;
        bottom: -4px;
        width: 84px;
        margin-left: -42px;
        filter: drop-shadow(0 0 12px rgb(255 110 203 / 0.55));
      }
      .water {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(60% + 1px);
        height: 40%;
        background: repeating-linear-gradient(
          to bottom,
          #120b17 0 1px,
          transparent 1px 3px,
          #120b17 3px 5px,
          transparent 5px 9px
        );
        opacity: 0.55;
        -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
      }
      .horizon {
        position: absolute;
        left: 0;
        right: 0;
        top: 60%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgb(255 190 232 / 0.55) 30%,
          color-mix(in srgb, rgb(255 190 232) 55%, white 45%) 50%,
          rgb(255 190 232 / 0.55) 70%,
          transparent 100%
        );
        box-shadow: 0 0 10px rgb(255 110 203 / 0.6);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="sky">
      <div class="sun"></div>
      <img class="mark" src="../../src/renderer/src/assets/vitra-logo.png" alt="" />
    </div>
    <div class="water"></div>
    <div class="horizon"></div>
  </body>
</html>
