<!doctype html>
<!-- 164x314 (NSIS at 100%). edges must stay exactly #150a0e = MUI_BGCOLOR -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 164px;
        height: 314px;
        position: relative;
        overflow: hidden;
        background: #150a0e;
      }
      .glow {
        position: absolute;
        left: 50%;
        top: 60%;
        width: 210px;
        height: 170px;
        translate: -50% -50%;
        background: radial-gradient(50% 50% at 50% 50%, rgb(255 57 99 / 0.34), rgb(255 57 99 / 0) 70%);
      }
      .sky {
        position: absolute;
        left: 50%;
        bottom: 40%;
        width: 164px;
        height: 190px;
        translate: -50% 0;
        overflow: hidden;
        -webkit-box-reflect: below 1px linear-gradient(transparent 30%, rgba(0, 0, 0, 0.5));
      }
      .sun {
        position: absolute;
        left: 50%;
        bottom: 14px;
        width: 96px;
        height: 96px;
        margin-left: -48px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 30%,
          #fffaf4 0%,
          oklch(0.93 0.05 55) 38%,
          oklch(0.82 0.11 55) 72%,
          oklch(0.72 0.15 55) 100%
        );
        box-shadow:
          0 0 30px 4px oklch(0.72 0.15 55 / 0.5),
          0 0 70px 18px oklch(0.72 0.15 55 / 0.18);
      }
      .mark {
        position: absolute;
        left: 50%;
        bottom: -4px;
        width: 84px;
        margin-left: -42px;
        filter: drop-shadow(0 0 12px rgb(255 57 99 / 0.55));
      }
      .water {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(60% + 1px);
        height: 40%;
        background: repeating-linear-gradient(
          to bottom,
          #150a0e 0 1px,
          transparent 1px 3px,
          #150a0e 3px 5px,
          transparent 5px 9px
        );
        opacity: 0.55;
        -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
      }
      .horizon {
        position: absolute;
        left: 0;
        right: 0;
        top: 60%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgb(255 204 206 / 0.55) 30%,
          color-mix(in srgb, rgb(255 204 206) 55%, white 45%) 50%,
          rgb(255 204 206 / 0.55) 70%,
          transparent 100%
        );
        box-shadow: 0 0 10px rgb(255 57 99 / 0.6);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="sky">
      <div class="sun"></div>
      <img class="mark" src="../../src/renderer/src/assets/vitra-logo.png" alt="" />
    </div>
    <div class="water"></div>
    <div class="horizon"></div>
  </body>
</html>
