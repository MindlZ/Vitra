<!doctype html>
<!-- 150x57. edges must stay exactly #150a0e = MUI_BGCOLOR -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 150px;
        height: 57px;
        position: relative;
        overflow: hidden;
        background: #150a0e;
      }
      .glow {
        position: absolute;
        left: 96px;
        top: 44px;
        width: 150px;
        height: 70px;
        translate: -50% -50%;
        background: radial-gradient(50% 50% at 50% 50%, rgb(255 57 99 / 0.3), rgb(255 57 99 / 0) 70%);
      }
      .sky {
        position: absolute;
        left: 96px;
        top: 0;
        width: 90px;
        height: 44px;
        translate: -50% 0;
        overflow: hidden;
        -webkit-box-reflect: below 1px linear-gradient(transparent 60%, rgba(0, 0, 0, 0.4));
      }
      .sun {
        position: absolute;
        left: 50%;
        bottom: 5px;
        width: 36px;
        height: 36px;
        margin-left: -18px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 30%,
          #fffaf4 0%,
          oklch(0.93 0.05 55) 38%,
          oklch(0.82 0.11 55) 72%,
          oklch(0.72 0.15 55) 100%
        );
        box-shadow: 0 0 12px 2px oklch(0.72 0.15 55 / 0.5);
      }
      .mark {
        position: absolute;
        left: 50%;
        bottom: -2px;
        width: 31px;
        margin-left: -15.5px;
        filter: drop-shadow(0 0 5px rgb(255 57 99 / 0.6));
      }
      .horizon {
        position: absolute;
        left: 40px;
        right: 4px;
        top: 44px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgb(255 204 206 / 0.55) 30%,
          color-mix(in srgb, rgb(255 204 206) 55%, white 45%) 55%,
          rgb(255 204 206 / 0.55) 75%,
          transparent 100%
        );
        box-shadow: 0 0 6px rgb(255 57 99 / 0.6);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="sky">
      <div class="sun"></div>
      <img class="mark" src="../../src/renderer/src/assets/vitra-logo.png" alt="" />
    </div>
    <div class="horizon"></div>
  </body>
</html>
